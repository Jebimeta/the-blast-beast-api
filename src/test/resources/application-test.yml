spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

blastbeast:
  site:
    name: The Blast Beast
    base-url: https://theblastbeast.test
    default-locale: es
  auth:
    secret: integration-test-secret-key-with-more-than-32-chars
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    cookie-name: bb_refresh
    cookie-secure: false
    cookie-domain:
    login-window: PT15M
    login-max-attempts: 3
    login-max-attempts-per-ip: 10
  bootstrap:
    # Sin credenciales: los tests crean sus propios usuarios.
    email:
    password:
    display-name: Redacción Blast Beast
  storage:
    public-base-url: https://theblastbeast.test/media
    local-root: target/test-media
    max-upload-bytes: 10485760
    thumb-width: 480
    hero-width: 1600
  ticketmaster:
    enabled: false
    api-key:
    base-url: https://app.ticketmaster.com/discovery/v2
    country-code: ES
    locale: es
    sync-cron: "0 0 */6 * * *"
    sync-days: 180
    window-days: 7
    page-size: 200
    max-pages-per-window: 5
    max-attempts: 3
    request-interval: 0ms
  ai:
    # Nunca se llama a un proveedor real durante los tests.
    base-url: https://ai.test
    api-key:
    model: test-model
    timeout: 1s

logging:
  level:
    root: WARN
    com.theblastbeast: INFO
    org.testcontainers: WARN
