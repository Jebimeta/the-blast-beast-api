spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# La documentación interactiva no se publica en producción. Caddy también
# bloquea /swagger-ui* y /v3/api-docs* por si acaso.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.theblastbeast: INFO
    org.hibernate: WARN
