spring:
  application:
    name: the-blast-beast-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blastbeast}
    username: ${DB_USER:blastbeast}
    password: ${DB_PASSWORD:blastbeast}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

blastbeast:
  site:
    name: The Blast Beast
    base-url: ${SITE_BASE_URL:http://localhost:4200}
    default-locale: es
  auth:
    # Sin valor por defecto: en producción debe venir de JWT_SECRET.
    # Los perfiles dev/local traen una clave de desarrollo.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    cookie-name: ${AUTH_COOKIE_NAME:bb_refresh}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Redacción Blast Beast}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/media}
    local-root: ${STORAGE_LOCAL_ROOT:./data/media}
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:10485760}
    thumb-width: ${STORAGE_THUMB_WIDTH:480}
    hero-width: ${STORAGE_HERO_WIDTH:1600}

logging:
  level:
    root: INFO
    com.theblastbeast: DEBUG
