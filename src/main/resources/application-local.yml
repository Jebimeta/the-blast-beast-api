spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev

blastbeast:
  auth:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
