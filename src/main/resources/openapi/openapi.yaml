openapi: 3.0.3

info:
  title: The Blast Beast API
  version: 0.1.0
  description: |
    API del portal de noticias de heavy metal The Blast Beast.

    Este contrato es la fuente de verdad: de aquí se generan los delegates del
    backend y el cliente TypeScript del frontend.
  contact:
    name: The Blast Beast
    url: https://github.com/Jebimeta

servers:
  - url: http://localhost:8080
    description: Entorno local
  - url: https://api.theblastbeast.com
    description: Producción

tags:
  - name: system
    description: Estado y metadatos del servicio
  - name: articles
    description: Artículos publicados
  - name: categories
    description: Categorías editoriales
  - name: bands
    description: Bandas mencionadas
  - name: search
    description: Búsqueda full-text
  - name: auth
    description: Sesión de la redacción
  - name: admin-articles
    description: Gestión editorial de artículos
  - name: admin-categories
    description: Gestión de categorías
  - name: admin-bands
    description: Gestión de bandas
  - name: admin-tags
    description: Gestión de etiquetas
  - name: admin-media
    description: Biblioteca de medios

paths:
  /api/v1/ping:
    get:
      tags:
        - system
      operationId: ping
      summary: Comprueba que la API responde
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  # -------------------------------------------------------------------
  # Lectura pública
  # -------------------------------------------------------------------
  /api/v1/articles:
    get:
      tags:
        - articles
      operationId: listArticles
      summary: Listado paginado de artículos publicados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: category
          in: query
          description: Slug de categoría
          schema:
            type: string
        - name: tag
          in: query
          description: Slug de etiqueta
          schema:
            type: string
        - name: band
          in: query
          description: Slug de banda
          schema:
            type: string
        - name: q
          in: query
          description: Texto de búsqueda full-text
          schema:
            type: string
        - name: sort
          in: query
          description: Orden del listado
          schema:
            $ref: '#/components/schemas/ArticleSort'
      responses:
        '200':
          description: Página de artículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/articles/featured:
    get:
      tags:
        - articles
      operationId: listFeaturedArticles
      summary: Artículos destacados para la portada
      responses:
        '200':
          description: Hasta cinco artículos, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleSummary'

  /api/v1/articles/{slug}:
    get:
      tags:
        - articles
      operationId: getArticle
      summary: Detalle de un artículo por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artículo publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

  /api/v1/categories:
    get:
      tags:
        - categories
      operationId: listCategories
      summary: Categorías con número de artículos publicados
      responses:
        '200':
          description: Categorías ordenadas para navegación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /api/v1/bands/{slug}:
    get:
      tags:
        - bands
      operationId: getBand
      summary: Banda y sus noticias relacionadas
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Banda con sus artículos publicados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/search:
    get:
      tags:
        - search
      operationId: searchArticles
      summary: Búsqueda full-text en español
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a buscar
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Resultados ordenados por relevancia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '400':
          $ref: '#/components/responses/BadRequest'

  # -------------------------------------------------------------------
  # Autenticación
  # -------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Inicia sesión en la redacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada; la cookie de refresco se envía en la respuesta
          headers:
            Set-Cookie:
              description: Cookie HttpOnly con el token de refresco
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      summary: Renueva el token de acceso usando la cookie de refresco
      responses:
        '200':
          description: Token de acceso renovado
          headers:
            Set-Cookie:
              description: Cookie HttpOnly con el token de refresco rotado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Cierra la sesión y revoca el token de refresco
      responses:
        '204':
          description: Sesión cerrada

  /api/v1/auth/me:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      summary: Usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario de la redacción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -------------------------------------------------------------------
  # Artículos (redacción)
  # -------------------------------------------------------------------
  /api/v1/admin/articles:
    get:
      tags:
        - admin-articles
      operationId: listAdminArticles
      summary: Listado editorial de artículos con filtros
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: Estado editorial
          schema:
            $ref: '#/components/schemas/AdminArticleStatus'
        - name: q
          in: query
          description: Texto libre sobre título o slug
          schema:
            type: string
      responses:
        '200':
          description: Página de artículos editoriales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticlePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - admin-articles
      operationId: createAdminArticle
      summary: Crea un artículo en borrador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
      responses:
        '201':
          description: Artículo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/articles/preview:
    post:
      tags:
        - admin-articles
      operationId: previewMarkdown
      summary: Renderiza Markdown con el mismo saneado que el artículo publicado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownPreviewRequest'
      responses:
        '200':
          description: HTML saneado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/articles/{id}:
    get:
      tags:
        - admin-articles
      operationId: getAdminArticle
      summary: Detalle editorial de un artículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Artículo editorial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - admin-articles
      operationId: updateAdminArticle
      summary: Actualiza un artículo y guarda una revisión
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
      responses:
        '200':
          description: Artículo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - admin-articles
      operationId: deleteAdminArticle
      summary: Elimina un artículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '204':
          description: Artículo eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/articles/{id}/publish:
    post:
      tags:
        - admin-articles
      operationId: publishAdminArticle
      summary: Publica un artículo (fija publishedAt si es la primera vez)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Artículo publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/articles/{id}/unpublish:
    post:
      tags:
        - admin-articles
      operationId: unpublishAdminArticle
      summary: Devuelve un artículo publicado a borrador
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Artículo despublicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/articles/{id}/archive:
    post:
      tags:
        - admin-articles
      operationId: archiveAdminArticle
      summary: Archiva un artículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Artículo archivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/articles/{id}/revisions:
    get:
      tags:
        - admin-articles
      operationId: listArticleRevisions
      summary: Historial de revisiones de un artículo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Revisiones de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleRevisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/articles/{id}/revisions/{revisionId}/restore:
    post:
      tags:
        - admin-articles
      operationId: restoreArticleRevision
      summary: Restaura una revisión como versión actual
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - name: revisionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Artículo restaurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------
  # Categorías (redacción)
  # -------------------------------------------------------------------
  /api/v1/admin/categories:
    get:
      tags:
        - admin-categories
      operationId: listAdminCategories
      summary: Todas las categorías, incluidas las vacías
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorías con contador total de artículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - admin-categories
      operationId: createAdminCategory
      summary: Crea una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/categories/{id}:
    put:
      tags:
        - admin-categories
      operationId: updateAdminCategory
      summary: Actualiza una categoría
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - admin-categories
      operationId: deleteAdminCategory
      summary: Elimina una categoría sin artículos
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Categoría eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # -------------------------------------------------------------------
  # Bandas (redacción)
  # -------------------------------------------------------------------
  /api/v1/admin/bands:
    get:
      tags:
        - admin-bands
      operationId: listAdminBands
      summary: Bandas con filtro por nombre
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Texto libre sobre nombre o slug
          schema:
            type: string
      responses:
        '200':
          description: Bandas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - admin-bands
      operationId: createAdminBand
      summary: Crea una banda
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandWriteRequest'
      responses:
        '201':
          description: Banda creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/bands/{id}:
    put:
      tags:
        - admin-bands
      operationId: updateAdminBand
      summary: Actualiza una banda
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandWriteRequest'
      responses:
        '200':
          description: Banda actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - admin-bands
      operationId: deleteAdminBand
      summary: Elimina una banda sin artículos asociados
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Banda eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # -------------------------------------------------------------------
  # Etiquetas (redacción)
  # -------------------------------------------------------------------
  /api/v1/admin/tags:
    get:
      tags:
        - admin-tags
      operationId: listAdminTags
      summary: Etiquetas con filtro por nombre
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Texto libre sobre nombre o slug
          schema:
            type: string
      responses:
        '200':
          description: Etiquetas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - admin-tags
      operationId: createAdminTag
      summary: Crea una etiqueta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
      responses:
        '201':
          description: Etiqueta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/tags/{id}:
    put:
      tags:
        - admin-tags
      operationId: updateAdminTag
      summary: Actualiza una etiqueta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
      responses:
        '200':
          description: Etiqueta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - admin-tags
      operationId: deleteAdminTag
      summary: Elimina una etiqueta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Etiqueta eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------
  # Medios (redacción)
  # -------------------------------------------------------------------
  /api/v1/admin/media:
    get:
      tags:
        - admin-media
      operationId: listAdminMedia
      summary: Biblioteca de medios paginada
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Texto libre sobre texto alternativo o crédito
          schema:
            type: string
      responses:
        '200':
          description: Página de medios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - admin-media
      operationId: uploadAdminMedia
      summary: Sube una imagen y genera variantes thumb y hero
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                altText:
                  type: string
                  maxLength: 300
                credit:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Medio subido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: El archivo supera el tamaño máximo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Formato de archivo no admitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/media/{id}:
    patch:
      tags:
        - admin-media
      operationId: updateAdminMedia
      summary: Actualiza texto alternativo y crédito
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUpdateRequest'
      responses:
        '200':
          description: Medio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - admin-media
      operationId: deleteAdminMedia
      summary: Elimina un medio y sus variantes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Medio eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: Página, empezando en 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Tamaño de página (máximo 50)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Autenticación requerida o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: El recurso entra en conflicto con el estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: El recurso ya no está disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PingResponse:
      type: object
      required:
        - status
        - app
        - version
        - timestamp
      properties:
        status:
          type: string
          example: UP
        app:
          type: string
          example: the-blast-beast-api
        version:
          type: string
          example: 0.1.0-SNAPSHOT
        timestamp:
          type: string
          format: date-time

    ArticleSort:
      type: string
      enum:
        - latest
        - oldest
        - relevance
      default: latest

    ArticleSummary:
      type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - category
        - authorName
        - publishedAt
        - readingMinutes
        - bands
        - tags
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        authorName:
          type: string
        publishedAt:
          type: string
          format: date-time
        readingMinutes:
          type: integer
        cover:
          $ref: '#/components/schemas/MediaSummary'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/BandSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'

    ArticleDetail:
      type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - bodyHtml
        - category
        - authorName
        - publishedAt
        - updatedAt
        - readingMinutes
        - bands
        - tags
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        bodyHtml:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        authorName:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readingMinutes:
          type: integer
        seoTitle:
          type: string
        seoDescription:
          type: string
        canonicalUrl:
          type: string
        cover:
          $ref: '#/components/schemas/MediaSummary'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/BandSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'

    ArticlePage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    CategorySummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string

    CategoryResponse:
      type: object
      required:
        - id
        - slug
        - name
        - articleCount
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        articleCount:
          type: integer
          format: int64

    BandSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        genre:
          type: string

    BandDetail:
      type: object
      required:
