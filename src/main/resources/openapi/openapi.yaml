          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        country:
          type: string
        formedYear:
          type: integer
        genre:
          type: string
        website:
          type: string
        bandcampUrl:
          type: string
        spotifyUrl:
          type: string
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'

    TagSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string

    ErrorResponse:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
          description: Código de error de negocio (p. ej. ART-001)

    # -----------------------------------------------------------------
    # Autenticación
    # -----------------------------------------------------------------
    AdminRole:
      type: string
      enum:
        - ADMIN
        - EDITOR

    LoginRequest:
      type: object
      required:
